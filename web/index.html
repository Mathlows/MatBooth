<!doctype html>
<html lang="fr" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Matbooth</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Accueil : choix du mode -->
  <section id="ecran-accueil" class="ecran actif">
    <div id="acces-admin" class="acces-admin" aria-hidden="true"></div>
    <p class="surtitre">Bienvenue</p>
    <h1 id="titre-evenement">&nbsp;</h1>
    <p class="consigne">Choisissez votre photo</p>
    <div id="modes" class="modes"></div>
    <button id="btn-galerie" class="bouton-galerie" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>
      Galerie des photos
    </button>
  </section>

  <!-- Galerie de l'événement -->
  <section id="ecran-galerie" class="ecran">
    <header class="entete-galerie">
      <button id="btn-galerie-accueil" class="bouton discret">‹ Accueil</button>
      <h2>Galerie</h2>
      <span class="espace-entete"></span>
    </header>
    <div id="grille-galerie" class="grille-galerie"></div>
    <p id="galerie-vide" class="consigne" hidden>Pas encore de photo pour cet événement.</p>
  </section>

  <!-- Une photo de la galerie -->
  <section id="ecran-photo-galerie" class="ecran">
    <div class="resultat-photo">
      <img id="image-galerie" alt="Photo de la galerie">
    </div>
    <aside class="resultat-panneau">
      <h2>Photo de la galerie</h2>
      <div class="actions">
        <div id="actions-galerie-partage" class="actions-partage">
          <button id="btn-galerie-qr" class="bouton partage"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M10.5 18.5h3"/></svg>
            Sur mon téléphone
          </button>
          <button id="btn-galerie-email" class="bouton partage"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="m3 6.5 9 6.5 9-6.5"/></svg>
            Par e-mail
          </button>
        </div>
        <p id="info-galerie-partage" class="info"></p>
        <button id="btn-galerie-imprimer" class="bouton principal">Imprimer</button>
        <p id="info-galerie" class="info"></p>
        <button id="btn-galerie-liste" class="bouton">Retour à la galerie</button>
        <button id="btn-galerie-supprimer" class="bouton discret danger">Effacer cette photo</button>
      </div>
    </aside>
  </section>

  <!-- Prise de vue -->
  <section id="ecran-capture" class="ecran">
    <img id="apercu" class="apercu" alt="">
    <div id="progression" class="progression"></div>
    <div id="decompte" class="decompte"></div>
    <div id="message-capture" class="message-capture"></div>
    <div id="vignettes-prises" class="vignettes-prises"></div>
    <div id="flash" class="flash"></div>
  </section>

  <!-- Attente (traitement, impression) -->
  <section id="ecran-attente" class="ecran">
    <div class="sablier"></div>
    <p id="texte-attente" class="grand-texte"></p>
  </section>

  <!-- Résultat : filtres, cadres, actions -->
  <section id="ecran-resultat" class="ecran">
    <div class="resultat-photo">
      <img id="rendu" alt="Votre photo">
    </div>
    <aside class="resultat-panneau">
      <div class="zone-choix">
        <h2>Filtres</h2>
        <div id="filtres" class="choix"></div>
        <h2>Cadres</h2>
        <div id="cadres" class="choix"></div>
      </div>
      <div class="actions">
        <div id="actions-partage" class="actions-partage" hidden>
          <button id="btn-qr" class="bouton partage" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M10.5 18.5h3"/></svg>
            Sur mon téléphone
          </button>
          <button id="btn-email" class="bouton partage" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="m3 6.5 9 6.5 9-6.5"/></svg>
            Par e-mail
          </button>
        </div>
        <p id="info-partage" class="info"></p>
        <button id="btn-imprimer" class="bouton principal">Imprimer</button>
        <p id="info-impression" class="info"></p>
        <button id="btn-terminer" class="bouton">Terminer sans imprimer</button>
        <div class="actions-secondaires">
          <button id="btn-reprendre" class="bouton discret">Recommencer</button>
          <button id="btn-supprimer" class="bouton discret danger">Supprimer</button>
        </div>
      </div>
    </aside>
  </section>

  <!-- Fin -->
  <section id="ecran-merci" class="ecran">
    <p class="grand-texte" id="texte-merci">Merci !</p>
    <p class="consigne" id="sous-texte-merci"></p>
  </section>

  <!-- QR code : la photo sur le téléphone du client -->
  <div id="fenetre-qr" class="modale" hidden>
    <div class="modale-boite large">
      <p class="modale-texte">Votre photo sur votre téléphone</p>
      <div id="qr-etapes" class="qr-etapes"></div>
      <button id="btn-fermer-qr" class="bouton principal">C'est bon</button>
    </div>
  </div>

  <!-- Saisie de l'adresse e-mail -->
  <div id="fenetre-email" class="modale" hidden>
    <div class="modale-boite large email">
      <p class="modale-texte">Recevoir la photo par e-mail</p>
      <div id="saisie-email" class="saisie-email"><span id="texte-email"></span><span class="curseur-saisie"></span></div>
      <p id="aide-email" class="aide-email">La photo partira dès que la borne aura accès à internet.</p>
      <div id="clavier" class="clavier"></div>
      <div class="modale-boutons">
        <button id="btn-annuler-email" class="bouton">Annuler</button>
        <button id="btn-envoyer-email" class="bouton principal">Envoyer</button>
      </div>
    </div>
  </div>

  <!-- Fenêtre de confirmation -->
  <div id="modale" class="modale" hidden>
    <div class="modale-boite">
      <p id="modale-texte" class="modale-texte"></p>
      <div id="modale-boutons" class="modale-boutons"></div>
    </div>
  </div>

  <div id="bandeau-erreur" class="bandeau-erreur" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
